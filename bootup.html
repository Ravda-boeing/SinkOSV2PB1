<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sink OS Boot</title>
  <link rel="icon" href="favicon.png" type="image/x-icon">

  <style>
    body {
      margin: 0;
      background-color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      color: #000;
      font-family: 'Segoe UI', sans-serif;
    }

    /* Elements faded in by boot.js */
    #boot-image, #boot-text, #config-bar, #config-label {
      opacity: 0;
      transition: opacity 2s ease;
    }

    #boot-image {
      max-width: 80%;
      height: auto;
    }

    h3 {
      font-style: italic;
      margin-top: 20px;
    }

    /* Configuring bar (sliding block) */
    #config-bar {
      width: 200px;
      height: 10px;
      background: #ddd;
      border-radius: 5px;
      overflow: hidden;
      margin: 20px auto 0;
    }

    #config-bar .block {
      width: 40px;
      height: 100%;
      background: #000;
      border-radius: 5px;
      animation: slide 1.2s linear infinite;
    }

    @keyframes slide {
      0%   { transform: translateX(-40px); }
      100% { transform: translateX(200px); }
    }

    #config-label {
      text-align: center;
      margin-top: 10px;
      font-size: 14px;
    }

    /* Initializing bar (bottom of screen, 2s) */
    #init-container {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      width: 300px;
      text-align: center;
      transition: opacity 0.5s ease;
    }

    #init-label {
      font-size: 14px;
      letter-spacing: 2px;
      margin-bottom: 10px;
      opacity: 0.8;
    }

    #init-track {
      width: 100%;
      height: 6px;
      background: #ddd;
      border-radius: 3px;
      overflow: hidden;
    }

    #init-fill {
      width: 0%;
      height: 100%;
      background: #000;
      border-radius: 3px;
      transition: width 2s linear;
    }
  </style>
</head>

<body>

  <audio id="startupSound" src="V2BETABOOTUP.MP3"></audio>

  <img src="assets/a modern and minimal.png" alt="Sink OS Boot Image" id="boot-image" />
  <h3 id="boot-text">Public Beta 1 V2</h3>

  <div id="config-bar">
    <div class="block"></div>
  </div>
  <div id="config-label">Configuring beta OS</div>

  <div id="init-container">
    <div id="init-label">Initializing</div>
    <div id="init-track"><div id="init-fill"></div></div>
  </div>

  <script>
    const INIT_DURATION_MS = 2000; // keep in sync with #init-fill transition

    const initContainer = document.getElementById("init-container");
    const initFill = document.getElementById("init-fill");

    // Two frames so the CSS width transition reliably triggers
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        initFill.style.width = "100%";
      });
    });

    // When initializing finishes, fade the bar out and start the boot sequence
    setTimeout(() => {
      initContainer.style.opacity = "0";

      const boot = document.createElement("script");
      boot.type = "module";
      boot.src = "dist/boot.js";
      boot.onerror = () => console.error("Failed to load dist/boot.js");
      document.body.appendChild(boot);
    }, INIT_DURATION_MS);
  </script>

</body>
</html>
