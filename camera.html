<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sink OS Camera</title>
  <link rel="icon" href="favicon.png" type="image/x-icon">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    .camera-app {
      width: 100vw;
      height: 100vh;
    }

    :root {
      /* Sink Camera token system — cool aperture glass over near-black,
         with a warm shutter-amber signature accent for capture/sync state. */
      --sink-bg: #05060a;
      --sink-surface: #0d0f18;
      --sink-surface-alt: #151827;
      --sink-glass: rgba(16, 19, 31, 0.55);
      --sink-accent: #5b8cff;
      --sink-accent-soft: rgba(91, 140, 255, 0.16);
      --sink-shutter: #ffb020;
      --sink-shutter-soft: rgba(255, 176, 32, 0.18);
      --sink-border: #23273a;
      --sink-border-soft: rgba(255, 255, 255, 0.06);
      --sink-text: #f5f7ff;
      --sink-text-muted: #8d93ac;
      --sink-danger: #ff4f6b;
      --sink-success: #35d18b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: transparent;
      color: var(--sink-text);
    }

    .camera-app {
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(ellipse 900px 500px at 15% -10%, rgba(91, 140, 255, 0.10), transparent 60%),
        radial-gradient(ellipse 700px 500px at 100% 110%, rgba(255, 176, 32, 0.06), transparent 60%),
        var(--sink-bg);
      overflow: hidden;
    }

    /* ---------- header ---------- */

    .camera-header {
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(to right, rgba(13, 15, 24, 0.9), rgba(9, 10, 17, 0.9));
      border-bottom: 1px solid var(--sink-border-soft);
      backdrop-filter: blur(18px);
    }

    .camera-title {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--sink-text-muted);
    }

    .camera-title-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 30%, #7bffb4, #00c46a);
      box-shadow: 0 0 8px rgba(0, 255, 153, 0.7);
    }

    .camera-header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--sink-text-muted);
    }

    .pill {
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--sink-border);
      background: rgba(9, 10, 17, 0.7);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .pill-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--sink-accent);
      box-shadow: 0 0 6px rgba(91, 140, 255, 0.8);
      flex-shrink: 0;
    }

    .pill-account {
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .pill-account:hover { border-color: var(--sink-accent); }
    .pill-account.signed-in .pill-dot {
      background: var(--sink-success);
      box-shadow: 0 0 6px rgba(53, 209, 139, 0.8);
    }
    .pill-account.signed-out .pill-dot {
      background: var(--sink-text-muted);
      box-shadow: none;
    }

    /* ---------- layout ---------- */

    .camera-main {
      flex: 1;
      display: grid;
      grid-template-columns: 3fr 2fr;
      min-height: 0;
    }

    @media (max-width: 900px) {
      .camera-main {
        grid-template-columns: 1fr;
        grid-template-rows: 2fr 1.2fr;
      }
    }

    .preview-panel {
      position: relative;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
    }

    .preview-surface {
      position: relative;
      flex: 1;
      border-radius: 16px;
      background: radial-gradient(circle at top, #171b2c 0, #05060a 60%);
      border: 1px solid var(--sink-border);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      max-width: 100%;
      max-height: 100%;
      border-radius: 10px;
      background: #000;
      transform: scaleX(-1);
    }

    .preview-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.07) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.07) 1px, transparent 1px);
      background-size: 33.33% 100%, 100% 33.33%;
      mix-blend-mode: soft-light;
      opacity: 0.35;
      pointer-events: none;
    }

    .shutter-flash {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
    }
    .shutter-flash.flash {
      animation: flashPulse 260ms ease-out;
    }
    @keyframes flashPulse {
      0% { opacity: 0.85; }
      100% { opacity: 0; }
    }

    .preview-hint {
      position: absolute;
      bottom: 12px;
      left: 12px;
      font-size: 10px;
      letter-spacing: 0.04em;
      color: var(--sink-text-muted);
      background: rgba(5, 6, 10, 0.6);
      border: 1px solid var(--sink-border-soft);
      padding: 3px 8px;
      border-radius: 999px;
      pointer-events: none;
    }

    /* ---------- controls ---------- */

    .controls-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .mode-toggle {
      display: inline-flex;
      padding: 3px;
      border-radius: 999px;
      background: rgba(9, 10, 17, 0.85);
      border: 1px solid var(--sink-border);
      gap: 2px;
    }

    .mode-btn {
      border: none;
      background: transparent;
      color: var(--sink-text-muted);
      font-size: 11px;
      padding: 5px 11px;
      border-radius: 999px;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .mode-btn.active {
      background: var(--sink-accent-soft);
      color: var(--sink-text);
    }

    .mode-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .capture-btn-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
    }

    /* capture button doubles as an upload-progress ring: a light sweeps
       around the rim while a photo is syncing to the SinkOS account */
    .capture-btn {
      width: 62px;
      height: 62px;
      border-radius: 999px;
      border: none;
      background: conic-gradient(var(--sink-shutter) var(--sync-progress, 0%), transparent 0);
      padding: 3px;
      cursor: pointer;
      position: relative;
      transition: transform 0.08s ease;
    }
    .capture-btn:active { transform: scale(0.94); }
    .capture-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .capture-btn-ring {
      width: 100%;
      height: 100%;
      border-radius: 999px;
      border: 3px solid rgba(255, 255, 255, 0.75);
      background: radial-gradient(circle at 30% 30%, #ffffff, #d7e0ff);
      box-shadow:
        0 0 0 4px rgba(255, 255, 255, 0.06),
        0 0 18px rgba(91, 140, 255, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .capture-btn-inner {
      width: calc(100% - 16px);
      height: calc(100% - 16px);
      border-radius: 999px;
      background: radial-gradient(circle at 30% 30%, #f5f7ff, #c3cffc);
    }

    .cloud-toggle {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      color: var(--sink-text-muted);
      cursor: pointer;
      user-select: none;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid var(--sink-border);
      background: rgba(9, 10, 17, 0.7);
      white-space: nowrap;
      transition: border-color 0.15s ease, color 0.15s ease;
    }
    .cloud-toggle.on {
      color: var(--sink-shutter);
      border-color: rgba(255, 176, 32, 0.4);
      background: var(--sink-shutter-soft);
    }
    .cloud-toggle input { display: none; }
    .cloud-dot {
      width: 6px; height: 6px; border-radius: 999px;
      background: currentColor;
      flex-shrink: 0;
    }

    /* ---------- side panel / gallery ---------- */

    .side-panel {
      padding: 16px 16px 18px 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
    }

    .side-surface {
      flex: 1;
      border-radius: 16px;
      background: radial-gradient(circle at top, #171b2c 0, #05060a 60%);
      border: 1px solid var(--sink-border);
      padding: 12px 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
    }

    .side-surface-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--sink-text-muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 0 2px;
    }

    .sync-all-btn {
      border: 1px solid var(--sink-border);
      background: rgba(9, 10, 17, 0.7);
      color: var(--sink-shutter);
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 999px;
      cursor: pointer;
      transition: border-color 0.15s ease;
    }
    .sync-all-btn:hover { border-color: var(--sink-shutter); }
    .sync-all-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .gallery-grid {
      margin-top: 2px;
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
      gap: 7px;
      overflow-y: auto;
      padding-right: 4px;
      align-content: start;
    }

    .gallery-empty {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--sink-text-muted);
      font-size: 11px;
      padding: 24px 10px;
      text-align: center;
      border: 1px dashed var(--sink-border);
      border-radius: 10px;
    }

    .thumb {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 9px;
      overflow: hidden;
      border: 1px solid var(--sink-border-soft);
      background: #05060a;
      cursor: pointer;
      transition: 0.12s ease;
    }
    .thumb:hover { border-color: var(--sink-accent); transform: translateY(-1px); }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .thumb-badge {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 16px;
      height: 16px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      background: rgba(5, 6, 10, 0.75);
      border: 1px solid var(--sink-border-soft);
    }
    .thumb-badge.local { color: var(--sink-text-muted); }
    .thumb-badge.compressing {
      color: var(--sink-accent);
      animation: spin 900ms linear infinite;
    }
    .thumb-badge.syncing {
      color: var(--sink-shutter);
      animation: spin 900ms linear infinite;
    }
    .thumb-badge.synced { color: var(--sink-success); }
    .thumb-badge.error { color: var(--sink-danger); }

    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    /* ---------- toast ---------- */

    .toast-stack {
      position: fixed;
      bottom: 16px;
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 50;
      pointer-events: none;
    }
    .toast {
      font-size: 11px;
      padding: 7px 12px;
      border-radius: 8px;
      background: rgba(9, 10, 17, 0.92);
      border: 1px solid var(--sink-border);
      color: var(--sink-text);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      opacity: 0;
      transform: translateY(6px);
      animation: toastIn 220ms ease forwards, toastOut 220ms ease forwards 2.6s;
    }
    .toast.success { border-color: rgba(53, 209, 139, 0.4); }
    .toast.error { border-color: rgba(255, 79, 107, 0.4); }
    @keyframes toastIn { to { opacity: 1; transform: translateY(0); } }
    @keyframes toastOut { to { opacity: 0; transform: translateY(-4px); } }

    canvas { display: none; }
  </style>
</head>

<body>
  <div class="camera-app">
    <header class="camera-header">
      <div class="camera-title">
        <span class="camera-title-dot"></span>
        <span>Sink Camera</span>
      </div>
      <div class="camera-header-right">
        <div class="pill" id="deviceLabelPill">
          <span class="pill-dot"></span>
          <span id="deviceLabel">Initialising camera…</span>
        </div>
        <span id="resolutionLabel">—</span>
        <div class="pill pill-account signed-out" id="accountPill" title="SinkOS account">
          <span class="pill-dot"></span>
          <span id="accountLabel">Checking account…</span>
        </div>
      </div>
    </header>

    <main class="camera-main">
      <section class="preview-panel">
        <div class="preview-surface">
          <video id="cameraPreview" autoplay playsinline></video>
          <div class="preview-grid"></div>
          <div class="shutter-flash" id="shutterFlash"></div>
          <div class="preview-hint">Mirrored preview</div>
        </div>

        <div class="controls-bar">
          <div class="mode-toggle">
            <button class="mode-btn active" data-mode="photo">Photo</button>
            <button class="mode-btn" data-mode="video" disabled>Video</button>
          </div>

          <div class="capture-btn-wrapper">
            <button class="capture-btn" id="captureBtn">
              <div class="capture-btn-ring">
                <div class="capture-btn-inner"></div>
              </div>
            </button>
          </div>

          <label class="cloud-toggle on" id="cloudToggleWrap">
            <input type="checkbox" id="cloudToggle" checked>
            <span class="cloud-dot"></span>
            <span id="cloudToggleLabel">Save to account</span>
          </label>
        </div>
      </section>

      <aside class="side-panel">
        <div class="side-surface">
          <div class="side-surface-header">
            <span>Gallery</span>
            <button class="sync-all-btn" id="syncAllBtn">Sync all</button>
          </div>
          <div class="gallery-grid" id="galleryGrid"></div>
        </div>
      </aside>
    </main>
  </div>

  <div class="toast-stack" id="toastStack"></div>

  <canvas id="captureCanvas"></canvas>

  <script>
    // CONFIGURE: same Supabase project used across SinkOS (ref okknkixdbjsnqrwlfgzn)
    const SUPABASE_URL = "https://okknkixdbjsnqrwlfgzn.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ra25raXhkYmpzbnFyd2xmZ3puIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1NzgwNzQsImV4cCI6MjA5ODE1NDA3NH0.L2QDUnez8KjIM8yg9cB9cs-tTq6nedk3CCpuJBjWBEg";
    const PHOTOS_BUCKET = "camera-photos";
    const PHOTOS_TABLE = "camera_photos";

    // Client-side compression target — tune these two if you want a
    // different size/quality tradeoff. 0.3MB @ maxWidthOrHeight 1920
    // brings a typical 3MB webcam capture down to a few hundred KB.
    const COMPRESSION_OPTIONS = {
      maxSizeMB: 0.3,
      maxWidthOrHeight: 1920,
      useWebWorker: true,
      fileType: "image/jpeg",
      initialQuality: 0.8
    };

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const video = document.getElementById("cameraPreview");
    const canvas = document.getElementById("captureCanvas");
    const captureBtn = document.getElementById("captureBtn");
    const deviceLabel = document.getElementById("deviceLabel");
    const resolutionLabel = document.getElementById("resolutionLabel");
    const shutterFlash = document.getElementById("shutterFlash");
    const galleryGrid = document.getElementById("galleryGrid");
    const accountPill = document.getElementById("accountPill");
    const accountLabel = document.getElementById("accountLabel");
    const cloudToggle = document.getElementById("cloudToggle");
    const cloudToggleWrap = document.getElementById("cloudToggleWrap");
    const syncAllBtn = document.getElementById("syncAllBtn");
    const toastStack = document.getElementById("toastStack");

    let mediaStream = null;
    let currentUser = null;

    // ---------- toast ----------
    function toast(message, kind = "") {
      const el = document.createElement("div");
      el.className = `toast ${kind}`;
      el.textContent = message;
      toastStack.appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }

    // ---------- camera ----------
    async function initCamera() {
      try {
        const constraints = {
          video: {
            facingMode: "user",
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        };

        mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = mediaStream;

        const track = mediaStream.getVideoTracks()[0];
        const settings = track.getSettings();
        deviceLabel.textContent = track.label || "Camera active";
        resolutionLabel.textContent = `${settings.width}×${settings.height}`;
      } catch (err) {
        console.error("Camera error:", err);
        deviceLabel.textContent = "Camera blocked";
        resolutionLabel.textContent = "—";
      }
    }

    // ---------- account (inline auth gate pattern) ----------
    async function initAccount() {
      const { data: { session } } = await sb.auth.getSession();
      currentUser = session?.user || null;
      renderAccountState();

      sb.auth.onAuthStateChange((_event, session) => {
        currentUser = session?.user || null;
        renderAccountState();
      });
    }

    function renderAccountState() {
      if (currentUser) {
        accountPill.classList.remove("signed-out");
        accountPill.classList.add("signed-in");
        accountLabel.textContent = currentUser.email || currentUser.user_metadata?.username || "Signed in";
        cloudToggleWrap.style.opacity = "1";
      } else {
        accountPill.classList.remove("signed-in");
        accountPill.classList.add("signed-out");
        accountLabel.textContent = "Sign in to sync";
        cloudToggleWrap.style.opacity = "0.6";
      }
    }

    accountPill.addEventListener("click", () => {
      if (!currentUser) {
        const redirect = encodeURIComponent(window.location.href);
        window.location.href = `login.html?redirect_to=${redirect}`;
      }
    });

    cloudToggle.addEventListener("change", () => {
      cloudToggleWrap.classList.toggle("on", cloudToggle.checked);
    });

    // ---------- local gallery store ----------
    function loadPhotos() {
      return JSON.parse(localStorage.getItem("sink_photos") || "[]");
    }

    function savePhotosLocal(photos) {
      localStorage.setItem("sink_photos", JSON.stringify(photos));
    }

    function renderGallery() {
      const photos = loadPhotos();
      galleryGrid.innerHTML = "";

      if (!photos.length) {
        const empty = document.createElement("div");
        empty.className = "gallery-empty";
        empty.textContent = "No photos yet — tap the shutter to start.";
        galleryGrid.appendChild(empty);
        return;
      }

      photos.forEach((photo, index) => {
        const thumb = document.createElement("div");
        thumb.className = "thumb";

        const img = document.createElement("img");
        img.src = photo.dataUrl;
        thumb.appendChild(img);

        const badge = document.createElement("div");
        badge.className = `thumb-badge ${photo.syncStatus || "local"}`;
        badge.textContent = badgeIcon(photo.syncStatus);
        badge.title = badgeTitle(photo.syncStatus);
        thumb.appendChild(badge);

        thumb.addEventListener("click", () => {
          if ((photo.syncStatus || "local") === "local" || photo.syncStatus === "error") {
            uploadPhoto(index);
          }
        });

        galleryGrid.appendChild(thumb);
      });
    }

    function badgeIcon(status) {
      if (status === "compressing") return "↻";
      if (status === "syncing") return "↻";
      if (status === "synced") return "✓";
      if (status === "error") return "!";
      return "○";
    }

    function badgeTitle(status) {
      if (status === "compressing") return "Compressing photo…";
      if (status === "syncing") return "Syncing to SinkOS account…";
      if (status === "synced") return "Saved to SinkOS account";
      if (status === "error") return "Sync failed — tap to retry";
      return "Saved on this device only — tap to sync";
    }

    // ---------- capture ----------
    function flashScreen() {
      shutterFlash.classList.remove("flash");
      void shutterFlash.offsetWidth; // restart animation
      shutterFlash.classList.add("flash");
    }

    function blobToDataUrl(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    async function capturePhoto() {
      if (!mediaStream) return;

      const track = mediaStream.getVideoTracks()[0];
      const settings = track.getSettings();
      const width = settings.width || video.videoWidth;
      const height = settings.height || video.videoHeight;

      canvas.width = width;
      canvas.height = height;

      const ctx = canvas.getContext("2d");
      ctx.save();
      ctx.scale(-1, 1);
      ctx.drawImage(video, -width, 0, width, height);
      ctx.restore();

      flashScreen();
      captureBtn.disabled = true;

      canvas.toBlob(async (rawBlob) => {
        try {
          // Compress before it ever touches localStorage or Supabase —
          // a 3MB raw capture typically lands around 150-300KB here.
          const compressedBlob = await imageCompression(
            new File([rawBlob], "capture.jpg", { type: "image/jpeg" }),
            COMPRESSION_OPTIONS
          );
          const dataUrl = await blobToDataUrl(compressedBlob);

          const photos = loadPhotos();
          photos.push({
            dataUrl,
            takenAt: new Date().toISOString(),
            sizeBytes: compressedBlob.size,
            syncStatus: "local"
          });
          savePhotosLocal(photos);
          renderGallery();

          if (cloudToggle.checked && currentUser) {
            uploadPhoto(photos.length - 1);
          } else if (cloudToggle.checked && !currentUser) {
            toast("Sign in to save this photo to your account", "error");
          }
        } catch (err) {
          console.error("Compression error:", err);
          toast("Couldn't process photo — try again", "error");
        } finally {
          captureBtn.disabled = false;
        }
      }, "image/jpeg", 0.92);
    }

    captureBtn.addEventListener("click", capturePhoto);

    // ---------- cloud sync ----------
    function dataUrlToBlob(dataUrl) {
      const [meta, base64] = dataUrl.split(",");
      const mime = meta.match(/:(.*?);/)[1];
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return new Blob([bytes], { type: mime });
    }

    function setPhotoStatus(index, status) {
      const photos = loadPhotos();
      if (!photos[index]) return;
      photos[index].syncStatus = status;
      savePhotosLocal(photos);
      renderGallery();
    }

    function setCaptureProgress(fraction) {
      captureBtn.style.setProperty("--sync-progress", `${Math.round(fraction * 100)}%`);
    }

    async function uploadPhoto(index) {
      if (!currentUser) {
        toast("Sign in to your SinkOS account first", "error");
        return;
      }

      const photos = loadPhotos();
      const photo = photos[index];
      if (!photo) return;

      setPhotoStatus(index, "syncing");
      setCaptureProgress(0.15);

      try {
        // photo.dataUrl is already compressed at capture time, so this
        // upload is the small optimized file, not the raw canvas frame.
        const blob = dataUrlToBlob(photo.dataUrl);
        const path = `${currentUser.id}/${Date.now()}_${index}.jpg`;

        setCaptureProgress(0.5);

        const { error: uploadError } = await sb.storage
          .from(PHOTOS_BUCKET)
          .upload(path, blob, { contentType: "image/jpeg", upsert: false });

        if (uploadError) throw uploadError;

        setCaptureProgress(0.8);

        const { error: insertError } = await sb
          .from(PHOTOS_TABLE)
          .insert({
            user_id: currentUser.id,
            storage_path: path,
            taken_at: photo.takenAt
          });

        if (insertError) throw insertError;

        setPhotoStatus(index, "synced");
        setCaptureProgress(1);
        toast("Photo saved to your SinkOS account", "success");
      } catch (err) {
        console.error("Upload error:", err);
        setPhotoStatus(index, "error");
        toast("Couldn't save photo — tap it to retry", "error");
      } finally {
        setTimeout(() => setCaptureProgress(0), 600);
      }
    }

    async function syncAll() {
      const photos = loadPhotos();
      const pending = photos
        .map((p, i) => ({ p, i }))
        .filter(({ p }) => (p.syncStatus || "local") !== "synced");

      if (!currentUser) {
        toast("Sign in to sync your photos", "error");
        return;
      }
      if (!pending.length) {
        toast("Everything is already synced");
        return;
      }

      syncAllBtn.disabled = true;
      for (const { i } of pending) {
        await uploadPhoto(i);
      }
      syncAllBtn.disabled = false;
    }

    syncAllBtn.addEventListener("click", syncAll);

    // ---------- init ----------
    initCamera();
    initAccount();
    renderGallery();
  </script>
</body>
</html>
