<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sink Slides — SinkOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --bg:#0A0C10;
    --bg-2:#0E1116;
    --panel:rgba(255,255,255,0.05);
    --panel-strong:rgba(255,255,255,0.08);
    --panel-border:rgba(255,255,255,0.09);
    --text:#E9EBF2;
    --text-dim:#8B93A7;
    --text-faint:#565D6E;
    --accent:#7C5CFF;
    --accent-2:#4FD1FF;
    --danger:#FF5C7A;
    --radius:14px;
    --font-display:'Space Grotesk',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(1100px 700px at 15% -10%, rgba(124,92,255,0.16), transparent 60%),
      radial-gradient(900px 600px at 100% 10%, rgba(79,209,255,0.10), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:rgba(124,92,255,0.35); }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
  input,select,textarea{ font-family:inherit; color:inherit; }

  .glass{
    background:var(--panel);
    border:1px solid var(--panel-border);
    backdrop-filter:blur(20px) saturate(140%);
    -webkit-backdrop-filter:blur(20px) saturate(140%);
  }

  /* ---------- App shell / auth gate ---------- */
  #authGate{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:14px; z-index:9999; background:var(--bg);
  }
  #authGate .spin{
    width:34px; height:34px; border-radius:50%;
    border:2px solid var(--panel-border); border-top-color:var(--accent);
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #authGate p{ font-family:var(--font-mono); font-size:13px; color:var(--text-dim); letter-spacing:0.02em; }

  #app{ display:none; height:100vh; width:100vw; }

  /* ---------- Dashboard ---------- */
  #dashboard{ height:100%; width:100%; overflow-y:auto; }
  .dash-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:28px 40px; position:sticky; top:0;
    background:linear-gradient(var(--bg) 60%, transparent);
    z-index:5;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{
    width:34px; height:34px; border-radius:9px;
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    position:relative; flex-shrink:0;
  }
  .brand-mark::before{
    content:""; position:absolute; inset:7px;
    border-radius:4px; background:var(--bg);
    clip-path:polygon(0 0, 100% 0, 100% 45%, 45% 45%, 45% 100%, 0 100%);
  }
  .brand h1{ font-family:var(--font-display); font-size:20px; font-weight:600; letter-spacing:-0.01em; }
  .brand span{ font-family:var(--font-mono); font-size:11px; color:var(--text-faint); display:block; margin-top:1px; }

  .btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:10px 18px; border-radius:10px; font-size:14px; font-weight:500;
    transition:transform 0.15s ease, background 0.15s ease, border-color .15s ease;
  }
  .btn:active{ transform:scale(0.97); }
  .btn-primary{ background:linear-gradient(135deg, var(--accent), #6247E0); color:#fff; }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-ghost{ background:var(--panel); border:1px solid var(--panel-border); color:var(--text); }
  .btn-ghost:hover{ background:var(--panel-strong); }
  .btn-danger{ color:var(--danger); }
  .btn-icon{ padding:9px; border-radius:9px; }

  .dash-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr));
    gap:18px; padding:8px 40px 60px;
  }
  .deck-card{
    border-radius:var(--radius); overflow:hidden; cursor:pointer;
    border:1px solid var(--panel-border); background:var(--panel);
    transition:transform .18s ease, border-color .18s ease, background .18s ease;
    position:relative;
  }
  .deck-card:hover{ transform:translateY(-3px); border-color:rgba(124,92,255,0.4); background:var(--panel-strong); }
  .deck-thumb{
    aspect-ratio:16/9; width:100%;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-size:13px; color:var(--text-faint);
    border-bottom:1px solid var(--panel-border);
    position:relative; overflow:hidden;
  }
  .deck-thumb .slide-mini{ width:100%; height:100%; }
  .deck-meta{ padding:12px 14px 14px; }
  .deck-meta h3{ font-size:14px; font-weight:600; margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .deck-meta p{ font-family:var(--font-mono); font-size:11px; color:var(--text-faint); }
  .deck-delete{
    position:absolute; top:8px; right:8px; width:26px; height:26px;
    border-radius:7px; background:rgba(10,12,16,0.7); backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .15s ease;
    color:var(--text-dim);
  }
  .deck-card:hover .deck-delete{ opacity:1; }
  .deck-delete:hover{ color:var(--danger); }

  .new-deck{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    border:1.5px dashed var(--panel-border); border-radius:var(--radius);
    aspect-ratio:4/3.1; cursor:pointer; color:var(--text-dim);
    transition:border-color .15s ease, color .15s ease, background .15s ease;
  }
  .new-deck:hover{ border-color:var(--accent); color:var(--text); background:rgba(124,92,255,0.06); }
  .new-deck .plus{ font-size:26px; font-family:var(--font-display); }
  .empty-state{ padding:100px 40px; text-align:center; color:var(--text-faint); font-family:var(--font-mono); font-size:13px; }

  /* ---------- Editor shell ---------- */
  #editor{ display:none; height:100%; width:100%; grid-template-rows:56px 1fr; grid-template-columns:220px 1fr 260px; }
  .topbar{
    grid-column:1/4; display:flex; align-items:center; justify-content:space-between;
    padding:0 16px; border-bottom:1px solid var(--panel-border); background:var(--bg-2);
    gap:16px;
  }
  .topbar-left{ display:flex; align-items:center; gap:10px; min-width:0; flex:1; }
  .topbar-left .back{ color:var(--text-dim); font-size:18px; padding:6px; border-radius:8px; }
  .topbar-left .back:hover{ background:var(--panel); color:var(--text); }
  #titleInput{
    background:none; border:1px solid transparent; font-family:var(--font-display);
    font-size:15px; font-weight:600; padding:6px 8px; border-radius:8px; min-width:0; flex:1;
    max-width:340px;
  }
  #titleInput:hover{ border-color:var(--panel-border); }
  #titleInput:focus{ outline:none; border-color:var(--accent); background:var(--panel); }
  .save-status{ font-family:var(--font-mono); font-size:11px; color:var(--text-faint); white-space:nowrap; }
  .topbar-right{ display:flex; align-items:center; gap:8px; }

  .rail{
    grid-column:1; border-right:1px solid var(--panel-border); background:var(--bg-2);
    overflow-y:auto; padding:14px 12px; display:flex; flex-direction:column; gap:10px;
  }
  .slide-thumb{
    border-radius:10px; border:1.5px solid var(--panel-border); cursor:pointer;
    aspect-ratio:16/9; position:relative; overflow:hidden; background:#000;
    transition:border-color .15s ease;
  }
  .slide-thumb.active{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(124,92,255,0.18); }
  .slide-thumb .mini-stage{
    position:absolute; inset:0; transform-origin:top left; pointer-events:none;
  }
  .slide-thumb .idx{
    position:absolute; bottom:4px; left:6px; font-family:var(--font-mono); font-size:10px;
    color:rgba(255,255,255,0.55);
  }
  .slide-thumb .trans-badge{
    position:absolute; top:4px; right:4px; font-family:var(--font-mono); font-size:8px;
    background:rgba(10,12,16,0.75); color:var(--accent-2); padding:2px 5px; border-radius:5px;
    letter-spacing:0.03em; text-transform:uppercase;
  }
  .rail-actions{ display:flex; gap:6px; padding-top:2px; }
  .add-slide-btn{
    width:100%; border:1.5px dashed var(--panel-border); border-radius:10px;
    aspect-ratio:16/9; display:flex; align-items:center; justify-content:center;
    color:var(--text-faint); font-size:20px; transition:all .15s ease;
  }
  .add-slide-btn:hover{ border-color:var(--accent); color:var(--accent); }

  .canvas-wrap{
    grid-column:2; display:flex; align-items:center; justify-content:center;
    padding:24px; overflow:auto; position:relative;
    background:
      radial-gradient(600px 400px at 50% 0%, rgba(124,92,255,0.05), transparent 70%);
  }
  #stage{
    width:960px; height:540px; position:relative; border-radius:6px;
    box-shadow:0 20px 60px rgba(0,0,0,0.55), 0 0 0 1px var(--panel-border);
    overflow:hidden; flex-shrink:0; transform-origin:center;
  }
  .el{
    position:absolute; cursor:move; outline:2px solid transparent; outline-offset:2px;
    transition:outline-color .1s ease;
  }
  .el.selected{ outline-color:var(--accent); }
  .el.text-el{ display:flex; padding:6px; overflow:hidden; word-break:break-word; }
  .el.text-el[contenteditable="true"]{ cursor:text; }
  .el .resize-handle{
    position:absolute; width:11px; height:11px; right:-6px; bottom:-6px;
    background:var(--accent); border-radius:3px; cursor:nwse-resize; display:none;
  }
  .el.selected .resize-handle{ display:block; }

  .panel-right{
    grid-column:3; border-left:1px solid var(--panel-border); background:var(--bg-2);
    overflow-y:auto; padding:18px 16px;
  }
  .panel-section{ margin-bottom:22px; }
  .panel-section h4{
    font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em;
    color:var(--text-faint); margin-bottom:10px;
  }
  .tool-row{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  .tool-btn{
    flex:1; padding:9px 6px; border-radius:9px; background:var(--panel);
    border:1px solid var(--panel-border); font-size:12px; text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--text-dim);
  }
  .tool-btn:hover{ background:var(--panel-strong); color:var(--text); border-color:rgba(124,92,255,0.4); }
  .field{ margin-bottom:10px; }
  .field label{ display:block; font-size:11.5px; color:var(--text-dim); margin-bottom:5px; }
  .field select, .field input[type=text], .field input[type=number]{
    width:100%; padding:8px 9px; border-radius:8px; background:var(--panel);
    border:1px solid var(--panel-border); font-size:13px;
  }
  .field select:focus, .field input:focus{ outline:none; border-color:var(--accent); }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .swatch-row{ display:flex; gap:6px; flex-wrap:wrap; }
  .swatch{ width:24px; height:24px; border-radius:7px; border:1.5px solid var(--panel-border); cursor:pointer; }
  .swatch.active{ border-color:#fff; }
  input[type=color]{ width:36px; height:30px; border:1px solid var(--panel-border); border-radius:7px; background:none; padding:2px; }
  .format-row{ display:flex; gap:6px; }
  .format-row .tool-btn{ flex:0 0 auto; padding:8px 12px; font-size:14px; }
  .format-row .tool-btn.active{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .empty-hint{ color:var(--text-faint); font-size:12.5px; line-height:1.5; }
  .danger-row{ margin-top:10px; }

  /* ---------- Present mode ---------- */
  #presentOverlay{
    display:none; position:fixed; inset:0; background:#000; z-index:8000;
    align-items:center; justify-content:center;
  }
  #presentStage{ width:100%; height:100%; position:relative; }
  .present-slide{
    position:absolute; inset:0; width:100%; height:100%;
  }
  .present-exit{
    position:fixed; top:18px; right:18px; z-index:8001; color:rgba(255,255,255,0.55);
    font-family:var(--font-mono); font-size:12px; padding:8px 12px; border-radius:8px;
    background:rgba(255,255,255,0.06);
  }
  .present-exit:hover{ color:#fff; background:rgba(255,255,255,0.12); }
  .present-nav{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:8001;
    font-family:var(--font-mono); font-size:11px; color:rgba(255,255,255,0.4);
  }

  /* transitions */
  .t-fade-enter{ animation:fadeIn .5s ease forwards; }
  .t-fade-exit{ animation:fadeOut .5s ease forwards; }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes fadeOut{ from{ opacity:1; } to{ opacity:0; } }
  .t-slide-enter{ animation:slideInR .5s cubic-bezier(.4,0,.2,1) forwards; }
  .t-slide-exit{ animation:slideOutL .5s cubic-bezier(.4,0,.2,1) forwards; }
  @keyframes slideInR{ from{ transform:translateX(100%); } to{ transform:translateX(0); } }
  @keyframes slideOutL{ from{ transform:translateX(0); } to{ transform:translateX(-100%); } }
  .t-zoom-enter{ animation:zoomIn .45s ease forwards; }
  .t-zoom-exit{ animation:zoomOut .45s ease forwards; }
  @keyframes zoomIn{ from{ opacity:0; transform:scale(1.15); } to{ opacity:1; transform:scale(1); } }
  @keyframes zoomOut{ from{ opacity:1; transform:scale(1); } to{ opacity:0; transform:scale(0.9); } }
  .t-flip-enter{ animation:flipIn .55s ease forwards; transform-style:preserve-3d; }
  .t-flip-exit{ animation:flipOut .55s ease forwards; transform-style:preserve-3d; }
  @keyframes flipIn{ from{ opacity:0; transform:perspective(1200px) rotateY(-90deg); } to{ opacity:1; transform:perspective(1200px) rotateY(0deg); } }
  @keyframes flipOut{ from{ opacity:1; transform:perspective(1200px) rotateY(0deg); } to{ opacity:0; transform:perspective(1200px) rotateY(90deg); } }

  #toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:#15181F; border:1px solid var(--panel-border); padding:12px 18px; border-radius:10px;
    font-size:13px; opacity:0; pointer-events:none; transition:all .25s ease; z-index:9500;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  input[type=file]{ display:none; }
</style>
</head>
<body>

  <div id="authGate">
    <div class="spin"></div>
    <p>VERIFYING SINKOS SESSION…</p>
  </div>

  <div id="app">

    <!-- DASHBOARD -->
    <div id="dashboard">
      <div class="dash-header">
        <div class="brand">
          <div class="brand-mark"></div>
          <div>
            <h1>Sink Slides</h1>
            <span id="userLabel">SINKOS · LOADING…</span>
          </div>
        </div>
        <button class="btn btn-primary" onclick="createNewPresentation()">＋ New presentation</button>
      </div>
      <div id="dashGrid" class="dash-grid"></div>
    </div>

    <!-- EDITOR -->
    <div id="editor">
      <div class="topbar">
        <div class="topbar-left">
          <button class="back" onclick="goToDashboard()">←</button>
          <input id="titleInput" value="Untitled Presentation" spellcheck="false" onblur="manualSave()" />
          <span class="save-status" id="saveStatus">Saved</span>
        </div>
        <div class="topbar-right">
          <button class="btn btn-ghost btn-icon" title="Export PDF" onclick="exportPDF()">PDF</button>
          <button class="btn btn-ghost btn-icon" title="Export PPTX" onclick="exportPPTX()">PPTX</button>
          <button class="btn btn-ghost" onclick="manualSave()">Save</button>
          <button class="btn btn-primary" onclick="startPresent()">▶ Present</button>
        </div>
      </div>

      <div class="rail" id="rail"></div>

      <div class="canvas-wrap">
        <div id="stage"></div>
      </div>

      <div class="panel-right" id="panelRight"></div>
    </div>
  </div>

  <div id="presentOverlay">
    <div class="present-exit" onclick="exitPresent()">ESC · EXIT</div>
    <div id="presentStage"></div>
    <div class="present-nav" id="presentNav"></div>
  </div>

  <div id="toast"></div>
  <input type="file" id="imgFileInput" accept="image/*" />
  <input type="file" id="bgFileInput" accept="image/*" />

<script>
/* =========================================================================
   SINK SLIDES — presentation editor module for SinkOS
   Follows SinkOS module conventions:
   - Supabase client is named `sb` (avoids the `supabase` global collision)
   - requireAuth() gate with ?redirect_to= round trip back to SinkOSAuth
   - Private per-user Supabase Storage bucket for slide/background images
   ========================================================================= */

// ---- CONFIG: fill these in to match your SinkOS Supabase project ----
const CONFIG = {
  SUPABASE_URL: "https://okknkixdbjsnqrwlfgzn.supabase.co",
  SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ra25raXhkYmpzbnFyd2xmZ3puIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1NzgwNzQsImV4cCI6MjA5ODE1NDA3NH0.L2QDUnez8KjIM8yg9cB9cs-tTq6nedk3CCpuJBjWBEg",
  SINKOS_AUTH_BASE: "https://ravda-boeing.github.io/SinkOSAuth/",
  STORAGE_BUCKET: "presentation-assets"
};

const sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

let currentUser = null;
let deck = null;          // { id, title, slides: [...] } — currently open presentation
let activeSlideIdx = 0;
let selectedElId = null;
let saveTimer = null;
let dirty = false;
let presentIdx = 0;
let presentEls = [];

const STAGE_W = 960, STAGE_H = 540;
const TRANSITIONS = ["none","fade","slide","zoom","flip"];

// ---------------------------------------------------------------------
// AUTH
// ---------------------------------------------------------------------
async function requireAuth(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){
    const redirectTo = encodeURIComponent(window.location.href);
    window.location.href = `${CONFIG.SINKOS_AUTH_BASE}index.html?redirect_to=${redirectTo}`;
    return null;
  }
  return session;
}

async function boot(){
  const session = await requireAuth();
  if(!session) return;
  currentUser = session.user;
  document.getElementById("authGate").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("userLabel").textContent =
    `SINKOS · ${(currentUser.email || currentUser.user_metadata?.username || "USER").toUpperCase()}`;

  const params = new URLSearchParams(window.location.search);
  const openId = params.get("id");
  await loadDashboard();
  if(openId){
    const target = allDecks.find(d => d.id === openId);
    if(target) openPresentation(target.id);
  }
}

// ---------------------------------------------------------------------
// DASHBOARD
// ---------------------------------------------------------------------
let allDecks = [];

async function loadDashboard(){
  const grid = document.getElementById("dashGrid");
  grid.innerHTML = `<div class="empty-state">Loading your presentations…</div>`;
  const { data, error } = await sb
    .from("presentations")
    .select("id,title,slides,updated_at")
    .eq("user_id", currentUser.id)
    .order("updated_at", { ascending:false });

  if(error){
    grid.innerHTML = `<div class="empty-state">Couldn't load presentations.<br>${escapeHtml(error.message)}</div>`;
    return;
  }
  allDecks = data || [];
  renderDashboard();
}

function renderDashboard(){
  const grid = document.getElementById("dashGrid");
  grid.innerHTML = "";

  const newCard = document.createElement("div");
  newCard.className = "new-deck";
  newCard.onclick = createNewPresentation;
  newCard.innerHTML = `<div class="plus">＋</div><div>New presentation</div>`;
  grid.appendChild(newCard);

  allDecks.forEach(d => {
    const card = document.createElement("div");
    card.className = "deck-card";
    card.onclick = () => openPresentation(d.id);
    const slides = d.slides || [];
    const first = slides[0];
    card.innerHTML = `
      <div class="deck-thumb">${first ? "" : "No slides yet"}</div>
      <div class="deck-meta">
        <h3>${escapeHtml(d.title || "Untitled")}</h3>
        <p>${slides.length} slide${slides.length===1?"":"s"} · ${timeAgo(d.updated_at)}</p>
      </div>
      <div class="deck-delete" title="Delete">✕</div>
    `;
    if(first){
      const mini = document.createElement("div");
      mini.className = "slide-mini";
      mini.style.cssText = "position:relative;width:100%;height:100%;";
      renderStageInto(mini, first, true);
      card.querySelector(".deck-thumb").appendChild(mini);
    }
    card.querySelector(".deck-delete").onclick = (e) => {
      e.stopPropagation();
      deletePresentation(d.id);
    };
    grid.appendChild(card);
  });

  if(allDecks.length === 0){
    // new-deck tile already invites action; nothing else needed
  }
}

async function createNewPresentation(){
  const blank = {
    user_id: currentUser.id,
    title: "Untitled Presentation",
    slides: [ blankSlide() ]
  };
  const { data, error } = await sb.from("presentations").insert(blank).select().single();
  if(error){ toast("Couldn't create presentation: " + error.message); return; }
  allDecks.unshift(data);
  openPresentation(data.id);
}

async function deletePresentation(id){
  if(!confirm("Delete this presentation? This can't be undone.")) return;
  const { error } = await sb.from("presentations").delete().eq("id", id);
  if(error){ toast("Delete failed: " + error.message); return; }
  allDecks = allDecks.filter(d => d.id !== id);
  renderDashboard();
  toast("Presentation deleted");
}

function goToDashboard(){
  document.getElementById("editor").style.display = "none";
  document.getElementById("dashboard").style.display = "block";
  deck = null;
  const url = new URL(window.location.href);
  url.searchParams.delete("id");
  window.history.replaceState({}, "", url);
  loadDashboard();
}

// ---------------------------------------------------------------------
// SLIDE DATA MODEL
// ---------------------------------------------------------------------
function blankSlide(){
  return {
    id: uid(),
    background: { type:"color", value:"#0A0C10" },
    transition: "fade",
    elements: []
  };
}

function uid(){ return Math.random().toString(36).slice(2, 10); }

// ---------------------------------------------------------------------
// OPEN / EDITOR
// ---------------------------------------------------------------------
async function openPresentation(id){
  const { data, error } = await sb.from("presentations").select("*").eq("id", id).single();
  if(error){ toast("Couldn't open presentation: " + error.message); return; }
  deck = data;
  if(!deck.slides || deck.slides.length === 0) deck.slides = [ blankSlide() ];
  activeSlideIdx = 0;
  selectedElId = null;

  const url = new URL(window.location.href);
  url.searchParams.set("id", deck.id);
  window.history.replaceState({}, "", url);

  document.getElementById("dashboard").style.display = "none";
  document.getElementById("editor").style.display = "grid";
  document.getElementById("titleInput").value = deck.title;

  renderRail();
  renderStage();
  renderPanel();
  setSaveStatus("Saved");
}

function markDirty(){
  dirty = true;
  setSaveStatus("Unsaved changes");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(manualSave, 1500);
}

function setSaveStatus(text){ document.getElementById("saveStatus").textContent = text; }

async function manualSave(){
  if(!deck) return;
  const title = document.getElementById("titleInput").value.trim() || "Untitled Presentation";
  deck.title = title;
  setSaveStatus("Saving…");
  const { error } = await sb.from("presentations")
    .update({ title: deck.title, slides: deck.slides })
    .eq("id", deck.id);
  if(error){ setSaveStatus("Save failed"); toast("Save failed: " + error.message); return; }
  dirty = false;
  setSaveStatus("Saved");
}

window.addEventListener("beforeunload", (e) => {
  if(dirty){ e.preventDefault(); e.returnValue = ""; }
});

// ---------------------------------------------------------------------
// RAIL (slide thumbnails)
// ---------------------------------------------------------------------
function renderRail(){
  const rail = document.getElementById("rail");
  rail.innerHTML = "";
  deck.slides.forEach((s, i) => {
    const thumb = document.createElement("div");
    thumb.className = "slide-thumb" + (i === activeSlideIdx ? " active" : "");
    thumb.onclick = () => selectSlide(i);
    const mini = document.createElement("div");
    mini.className = "mini-stage";
    mini.style.width = STAGE_W + "px";
    mini.style.height = STAGE_H + "px";
    mini.style.transform = "scale(" + (208/STAGE_W) + ")";
    renderStageInto(mini, s, true);
    thumb.appendChild(mini);
    const idx = document.createElement("div");
    idx.className = "idx"; idx.textContent = i+1;
    thumb.appendChild(idx);
    if(s.transition !== "none"){
      const badge = document.createElement("div");
      badge.className = "trans-badge"; badge.textContent = s.transition;
      thumb.appendChild(badge);
    }
    rail.appendChild(thumb);
  });
  const addBtn = document.createElement("button");
  addBtn.className = "add-slide-btn";
  addBtn.textContent = "＋";
  addBtn.onclick = addSlide;
  rail.appendChild(addBtn);
}

function addSlide(){
  deck.slides.push(blankSlide());
  activeSlideIdx = deck.slides.length - 1;
  selectedElId = null;
  renderRail(); renderStage(); renderPanel();
  markDirty();
}

function deleteSlide(i){
  if(deck.slides.length === 1){ toast("A presentation needs at least one slide"); return; }
  deck.slides.splice(i,1);
  activeSlideIdx = Math.max(0, Math.min(activeSlideIdx, deck.slides.length-1));
  selectedElId = null;
  renderRail(); renderStage(); renderPanel();
  markDirty();
}

function moveSlide(i, dir){
  const j = i + dir;
  if(j < 0 || j >= deck.slides.length) return;
  [deck.slides[i], deck.slides[j]] = [deck.slides[j], deck.slides[i]];
  if(activeSlideIdx === i) activeSlideIdx = j;
  else if(activeSlideIdx === j) activeSlideIdx = i;
  renderRail(); renderStage(); renderPanel();
  markDirty();
}

function selectSlide(i){
  activeSlideIdx = i;
  selectedElId = null;
  renderRail(); renderStage(); renderPanel();
}

// ---------------------------------------------------------------------
// STAGE / CANVAS RENDERING
// ---------------------------------------------------------------------
function currentSlide(){ return deck.slides[activeSlideIdx]; }

function applyBackground(node, bg){
  if(!bg){ node.style.background = "#0A0C10"; return; }
  if(bg.type === "color"){ node.style.background = bg.value; }
  else if(bg.type === "gradient"){ node.style.background = bg.value; }
  else if(bg.type === "image"){ node.style.background = `center/cover no-repeat url("${bg.value}")`; }
}

function renderStage(){
  const stage = document.getElementById("stage");
  stage.innerHTML = "";
  renderStageInto(stage, currentSlide(), false);
}

// Renders a slide into a given container. `readOnly` skips interactivity (used for thumbnails/exports).
function renderStageInto(container, slide, readOnly){
  container.style.width = STAGE_W + "px";
  container.style.height = STAGE_H + "px";
  applyBackground(container, slide.background);
  (slide.elements || []).forEach(el => {
    const node = buildElementNode(el, readOnly);
    container.appendChild(node);
  });
}

function buildElementNode(el, readOnly){
  const node = document.createElement("div");
  node.className = "el" + (el.type === "text" ? " text-el" : "");
  node.style.left = el.x + "px";
  node.style.top = el.y + "px";
  node.style.width = el.w + "px";
  node.style.height = el.h + "px";
  node.dataset.id = el.id;

  if(el.type === "text"){
    node.contentEditable = readOnly ? "false" : "true";
    node.style.fontSize = (el.fontSize||28) + "px";
    node.style.fontFamily = "'Inter',sans-serif";
    node.style.color = el.color || "#FFFFFF";
    node.style.fontWeight = el.bold ? "700" : "400";
    node.style.fontStyle = el.italic ? "italic" : "normal";
    node.style.textAlign = el.align || "left";
    node.style.alignItems = el.valign === "center" ? "center" : el.valign === "bottom" ? "flex-end" : "flex-start";
    node.style.justifyContent = el.align === "center" ? "center" : el.align === "right" ? "flex-end" : "flex-start";
    node.innerText = el.content || "";
    if(!readOnly){
      node.addEventListener("input", () => { el.content = node.innerText; markDirty(); });
    }
  } else if(el.type === "image"){
    node.style.backgroundImage = `url("${el.src}")`;
    node.style.backgroundSize = "cover";
    node.style.backgroundPosition = "center";
    node.style.borderRadius = (el.rounded ? "10px" : "0");
  } else if(el.type === "shape"){
    node.style.background = el.fill || "#7C5CFF";
    node.style.borderRadius = el.shapeType === "ellipse" ? "50%" : (el.rounded ? "12px" : "0");
  }

  if(!readOnly){
    node.addEventListener("pointerdown", (e) => onElPointerDown(e, el, node));
    const handle = document.createElement("div");
    handle.className = "resize-handle";
    handle.addEventListener("pointerdown", (e) => onResizePointerDown(e, el, node));
    node.appendChild(handle);
    if(el.id === selectedElId) node.classList.add("selected");
  }
  return node;
}

function onElPointerDown(e, el, node){
  if(e.target.classList.contains("resize-handle")) return;
  e.stopPropagation();
  selectElement(el.id);
  if(e.target === node && node.isContentEditable) return; // allow text click-to-edit without drag on single click
  const startX = e.clientX, startY = e.clientY;
  const origX = el.x, origY = el.y;
  let moved = false;
  function onMove(ev){
    moved = true;
    const dx = ev.clientX - startX, dy = ev.clientY - startY;
    el.x = clamp(origX + dx, -el.w+20, STAGE_W-20);
    el.y = clamp(origY + dy, -el.h+20, STAGE_H-20);
    node.style.left = el.x + "px";
    node.style.top = el.y + "px";
  }
  function onUp(){
    document.removeEventListener("pointermove", onMove);
    document.removeEventListener("pointerup", onUp);
    if(moved) markDirty();
  }
  document.addEventListener("pointermove", onMove);
  document.addEventListener("pointerup", onUp);
}

function onResizePointerDown(e, el, node){
  e.stopPropagation(); e.preventDefault();
  const startX = e.clientX, startY = e.clientY;
  const origW = el.w, origH = el.h;
  function onMove(ev){
    const dx = ev.clientX - startX, dy = ev.clientY - startY;
    el.w = clamp(origW + dx, 30, STAGE_W);
    el.h = clamp(origH + dy, 20, STAGE_H);
    node.style.width = el.w + "px";
    node.style.height = el.h + "px";
  }
  function onUp(){
    document.removeEventListener("pointermove", onMove);
    document.removeEventListener("pointerup", onUp);
    markDirty();
  }
  document.addEventListener("pointermove", onMove);
  document.addEventListener("pointerup", onUp);
}

function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }

document.getElementById("stage").addEventListener("pointerdown", (e) => {
  if(e.target.id === "stage"){ selectedElId = null; renderStage(); renderPanel(); }
});

function selectElement(id){
  selectedElId = id;
  document.querySelectorAll("#stage .el").forEach(n => {
    n.classList.toggle("selected", n.dataset.id === id);
  });
  renderPanel();
}

function currentElement(){
  if(!selectedElId) return null;
  return (currentSlide().elements || []).find(e => e.id === selectedElId) || null;
}

function deleteSelectedElement(){
  const s = currentSlide();
  s.elements = s.elements.filter(e => e.id !== selectedElId);
  selectedElId = null;
  renderStage(); renderPanel();
  markDirty();
}

async function uploadAsset(file){
  const path = `${currentUser.id}/${deck.id}/${uid()}-${file.name}`;
  const { error: upErr } = await sb.storage.from(CONFIG.STORAGE_BUCKET).upload(path, file, { upsert:true });
  if(upErr){ toast("Upload failed: " + upErr.message); return null; }
  const { data: signed, error: signErr } = await sb.storage
    .from(CONFIG.STORAGE_BUCKET).createSignedUrl(path, 60 * 60 * 24 * 365);
  if(signErr){ toast("Couldn't get image URL: " + signErr.message); return null; }
  return signed.signedUrl;
}

// RIGHT PANEL
// ---------------------------------------------------------------------
const BG_PRESETS = ["#0A0C10","#12141C","#1B1035","#3C1642","#0E2A3F","#1A1A1A","#F4F1EA","#FFFFFF"];
const GRADIENT_PRESETS = [
  "linear-gradient(135deg,#7C5CFF,#4FD1FF)",
  "linear-gradient(135deg,#FF5C7A,#7C5CFF)",
  "linear-gradient(135deg,#0E2A3F,#12141C)",
  "linear-gradient(135deg,#F4A261,#7C5CFF)"
];
const TEXT_COLORS = ["#FFFFFF","#0A0C10","#7C5CFF","#4FD1FF","#FF5C7A","#F4A261"];

function renderPanel(){
  const panel = document.getElementById("panelRight");
  const s = currentSlide();
  const el = currentElement();
  panel.innerHTML = "";

  panel.appendChild(section("Add to slide", `
    <div class="tool-row">
      <button class="tool-btn" onclick="addTextElement()">🔤<span>Text</span></button>
      <button class="tool-btn" onclick="addShapeElement('rect')">▭<span>Rect</span></button>
      <button class="tool-btn" onclick="addShapeElement('ellipse')">◯<span>Ellipse</span></button>
      <button class="tool-btn" onclick="addImageElement()">🖼<span>Image</span></button>
    </div>
  `));

  const bgSection = document.createElement("div");
  bgSection.className = "panel-section";
  bgSection.innerHTML = `<h4>Slide background</h4>
    <div class="swatch-row" id="bgSwatches"></div>
    <div class="swatch-row" style="margin-top:8px;" id="bgGradients"></div>
    <div class="field" style="margin-top:10px;">
      <div class="tool-row">
        <button class="tool-btn" id="bgImageBtn">🖼<span>Image bg</span></button>
        <input type="color" id="bgColorPicker" value="#0A0C10">
      </div>
    </div>`;
  panel.appendChild(bgSection);
  bgSection.querySelector("#bgImageBtn").onclick = () => document.getElementById("bgFileInput").click();
  bgSection.querySelector("#bgColorPicker").addEventListener("input", (ev) => {
    s.background = { type:"color", value: ev.target.value };

  });
  const swRow = bgSection.querySelector("#bgSwatches");
  BG_PRESETS.forEach(c => {
    const sw = document.createElement("div");
    sw.className = "swatch"; sw.style.background = c;
    if(s.background?.type==="color" && s.background.value===c) sw.classList.add("active");
    sw.onclick = () => { s.background = { type:"color", value:c }; renderStage(); renderRail(); markDirty(); };
    swRow.appendChild(sw);
  });
  const grRow = bgSection.querySelector("#bgGradients");
  GRADIENT_PRESETS.forEach(g => {
    const sw = document.createElement("div");
    sw.className = "swatch"; sw.style.background = g;
    if(s.background?.type==="gradient" && s.background.value===g) sw.classList.add("active");
    sw.onclick = () => { s.background = { type:"gradient", value:g }; renderStage(); renderRail(); markDirty(); };
    grRow.appendChild(sw);
  });

  const transSection = document.createElement("div");
  transSection.className = "panel-section";
  transSection.innerHTML = `<h4>Transition (on entering this slide)</h4>
    <div class="field"><select id="transSelect">
      ${TRANSITIONS.map(t => `<option value="${t}" ${s.transition===t?"selected":""}>${t[0].toUpperCase()+t.slice(1)}</option>`).join("")}
    </select></div>`;
  panel.appendChild(transSection);
  transSection.querySelector("#transSelect").addEventListener("change", (ev) => {
    s.transition = ev.target.value;
    renderRail(); markDirty();
  });

  const slideActions = document.createElement("div");
  slideActions.className = "panel-section";
  slideActions.innerHTML = `<h4>Slide</h4>
    <div class="tool-row">
      <button class="tool-btn" onclick="moveSlide(${activeSlideIdx},-1)">↑<span>Up</span></button>
      <button class="tool-btn" onclick="moveSlide(${activeSlideIdx},1)">↓<span>Down</span></button>
      <button class="tool-btn btn-danger" onclick="deleteSlide(${activeSlideIdx})">✕<span>Delete</span></button>
    </div>`;
  panel.appendChild(slideActions);

  if(el){
    const elSection = document.createElement("div");
    elSection.className = "panel-section";
    let inner = `<h4>Selected element</h4>`;

    if(el.type === "text"){
      inner += `
        <div class="field"><label>Font size</label>
          <input type="number" id="fontSizeInput" value="${el.fontSize}" min="10" max="140"></div>
        <div class="field"><label>Alignment</label>
          <div class="format-row">
            <button class="tool-btn ${el.align==='left'?'active':''}" data-align="left">⯇</button>
            <button class="tool-btn ${el.align==='center'?'active':''}" data-align="center">≡</button>
            <button class="tool-btn ${el.align==='right'?'active':''}" data-align="right">⯈</button>
            <button class="tool-btn ${el.bold?'active':''}" id="boldBtn"><b>B</b></button>
            <button class="tool-btn ${el.italic?'active':''}" id="italicBtn"><i>I</i></button>
          </div>
        </div>
        <div class="field"><label>Text color</label>
          <div class="swatch-row" id="textColorRow"></div>
        </div>`;
    } else if(el.type === "shape"){
      inner += `
        <div class="field"><label>Fill color</label>
          <input type="color" id="shapeFillPicker" value="${toHex(el.fill)}"></div>`;
    } else if(el.type === "image"){
      inner += `
        <div class="field"><label>Corners</label>
          <div class="format-row">
            <button class="tool-btn ${el.rounded?'active':''}" id="roundedBtn">Rounded</button>
            <button class="tool-btn ${!el.rounded?'active':''}" id="sharpBtn">Sharp</button>
          </div></div>`;
    }
    inner += `<div class="danger-row"><button class="btn btn-ghost btn-danger" onclick="deleteSelectedElement()" style="width:100%;">Delete element</button></div>`;
    elSection.innerHTML = inner;
    panel.appendChild(elSection);

    if(el.type === "text"){
      elSection.querySelector("#fontSizeInput").addEventListener("input", (ev) => {
        el.fontSize = parseInt(ev.target.value)||28; renderStage(); markDirty();
      });
      elSection.querySelectorAll("[data-align]").forEach(b => b.onclick = () => {
        el.align = b.dataset.align; renderStage(); renderPanel(); markDirty();
      });
      elSection.querySelector("#boldBtn").onclick = () => { el.bold = !el.bold; renderStage(); renderPanel(); markDirty(); };
      elSection.querySelector("#italicBtn").onclick = () => { el.italic = !el.italic; renderStage(); renderPanel(); markDirty(); };
      const tcRow = elSection.querySelector("#textColorRow");
      TEXT_COLORS.forEach(c => {
        const sw = document.createElement("div");
        sw.className = "swatch"; sw.style.background = c;
        if(el.color===c) sw.classList.add("active");
        sw.onclick = () => { el.color = c; renderStage(); renderPanel(); markDirty(); };
        tcRow.appendChild(sw);
      });
    } else if(el.type === "shape"){
      elSection.querySelector("#shapeFillPicker").addEventListener("input", (ev) => {
        el.fill = ev.target.value; renderStage(); markDirty();
      });
    } else if(el.type === "image"){
      elSection.querySelector("#roundedBtn").onclick = () => { el.rounded = true; renderStage(); renderPanel(); markDirty(); };
      elSection.querySelector("#sharpBtn").onclick = () => { el.rounded = false; renderStage(); renderPanel(); markDirty(); };
    }
  } else {
    const hint = document.createElement("div");
    hint.className = "panel-section";
    hint.innerHTML = `<p class="empty-hint">Click an element on the slide to edit its style, or add a new one above.</p>`;
    panel.appendChild(hint);
  }
}

function section(title, html){
  const d = document.createElement("div");
  d.className = "panel-section";
  d.innerHTML = `<h4>${title}</h4>${html}`;
  return d;
}

function toHex(c){
  if(!c) return "#7C5CFF";
  if(c.startsWith("#")) return c;
  return "#7C5CFF";
}

// ---------------------------------------------------------------------
// PRESENT MODE
// ---------------------------------------------------------------------
function startPresent(){
  presentIdx = activeSlideIdx;
  document.getElementById("presentOverlay").style.display = "flex";
  renderPresentSlide(presentIdx, null);
  document.addEventListener("keydown", onPresentKey);
}

function exitPresent(){
  document.getElementById("presentOverlay").style.display = "none";
  document.getElementById("presentStage").innerHTML = "";
  document.removeEventListener("keydown", onPresentKey);
}

function onPresentKey(e){
  if(e.key === "Escape") exitPresent();
  else if(e.key === "ArrowRight" || e.key === " ") presentGo(1);
  else if(e.key === "ArrowLeft") presentGo(-1);
}

function presentGo(dir){
  const next = presentIdx + dir;
  if(next < 0 || next >= deck.slides.length) return;
  const prevIdx = presentIdx;
  presentIdx = next;
  renderPresentSlide(presentIdx, dir > 0 ? "forward" : "backward", prevIdx);
}

function renderPresentSlide(idx, direction, prevIdx){
  const stage = document.getElementById("presentStage");
  const slide = deck.slides[idx];
  const nav = document.getElementById("presentNav");
  nav.textContent = `${idx+1} / ${deck.slides.length}`;

  const wrap = document.createElement("div");
  wrap.className = "present-slide";
  scaleToViewport(wrap, slide);

  const trans = slide.transition || "none";
  const old = stage.querySelector(".present-slide");

  if(trans !== "none" && direction){
    if(old){
      old.classList.add(`t-${trans}-exit`);
      setTimeout(() => old.remove(), 550);
    }
    wrap.classList.add(`t-${trans}-enter`);
  } else if(old){
    old.remove();
  }
  stage.appendChild(wrap);
}

function scaleToViewport(wrap, slide){
  const inner = document.createElement("div");
  inner.style.width = STAGE_W + "px";
  inner.style.height = STAGE_H + "px";
  inner.style.position = "absolute";
  const scale = Math.min(window.innerWidth/STAGE_W, window.innerHeight/STAGE_H);
  inner.style.left = "50%"; inner.style.top = "50%";
  inner.style.transform = `translate(-50%,-50%) scale(${scale})`;
  renderStageInto(inner, slide, true);
  wrap.appendChild(inner);
}

// ---------------------------------------------------------------------
// EXPORT: PDF
// ---------------------------------------------------------------------
async function exportPDF(){
  toast("Building PDF…");
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation:"landscape", unit:"in", format:[10, 5.625] });

  const holder = document.createElement("div");
  holder.style.position = "fixed";
  holder.style.left = "-99999px";
  holder.style.top = "0";
  holder.style.width = STAGE_W + "px";
  holder.style.height = STAGE_H + "px";
  document.body.appendChild(holder);

  for(let i=0; i<deck.slides.length; i++){
    holder.innerHTML = "";
    renderStageInto(holder, deck.slides[i], true);
    await new Promise(r => setTimeout(r, 60)); // let images settle
    const canvas = await html2canvas(holder, { backgroundColor:null, useCORS:true, scale:2 });
    const img = canvas.toDataURL("image/jpeg", 0.92);
    if(i > 0) pdf.addPage([10,5.625], "landscape");
    pdf.addImage(img, "JPEG", 0, 0, 10, 5.625);
  }
  document.body.removeChild(holder);
  pdf.save(`${sanitizeFilename(deck.title)}.pdf`);
  toast("PDF exported");
}

// ---------------------------------------------------------------------
// EXPORT: PPTX
// ---------------------------------------------------------------------
const PX_TO_IN = 10 / STAGE_W; // 960px stage == 10in slide width

async function exportPPTX(){
  toast("Building PPTX…");
  const pptx = new window.PptxGenJS();
  pptx.defineLayout({ name:"SINK", width:10, height:5.625 });
  pptx.layout = "SINK";

  for(const slide of deck.slides){
    const pSlide = pptx.addSlide();

    if(slide.background?.type === "color"){
      pSlide.background = { color: slide.background.value.replace("#","") };
    } else if(slide.background?.type === "gradient"){
      pSlide.background = { color: "12141C" }; // pptx has no CSS gradients; fallback solid
    } else if(slide.background?.type === "image"){
      try{
        const b64 = await urlToBase64(slide.background.value);
        pSlide.background = { data: b64 };
      }catch(e){ pSlide.background = { color:"0A0C10" }; }
    }

    for(const el of (slide.elements||[])){
      const x = el.x * PX_TO_IN, y = el.y * PX_TO_IN, w = el.w * PX_TO_IN, h = el.h * PX_TO_IN;
      if(el.type === "text"){
        pSlide.addText(el.content || "", {
          x, y, w, h,
          fontSize: Math.round((el.fontSize||28) * 0.75),
          color: (el.color||"#FFFFFF").replace("#",""),
          bold: !!el.bold, italic: !!el.italic,
          align: el.align || "left",
          valign: el.valign || "top",
          fontFace: "Arial"
        });
      } else if(el.type === "shape"){
        pSlide.addShape(el.shapeType === "ellipse" ? pptx.ShapeType.ellipse : pptx.ShapeType.rect, {
          x, y, w, h, fill: { color: (el.fill||"#7C5CFF").replace("#","") }
        });
      } else if(el.type === "image"){
        try{
          const b64 = await urlToBase64(el.src);
          pSlide.addImage({ data:b64, x, y, w, h });
        }catch(e){ /* skip broken image */ }
      }
    }
  }

  await pptx.writeFile({ fileName: `${sanitizeFilename(deck.title)}.pptx` });
  toast("PPTX exported");
}

async function urlToBase64(url){
  const res = await fetch(url);
  const blob = await res.blob();
  return await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

// ---------------------------------------------------------------------
// UTIL
// ---------------------------------------------------------------------
function escapeHtml(s){
  return String(s||"").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function sanitizeFilename(s){ return (s||"presentation").replace(/[^a-z0-9\-_ ]/gi,"").trim() || "presentation"; }
function timeAgo(iso){
  if(!iso) return "";
  const s = Math.floor((Date.now() - new Date(iso).getTime())/1000);
  if(s < 60) return "just now";
  if(s < 3600) return Math.floor(s/60) + "m ago";
  if(s < 86400) return Math.floor(s/3600) + "h ago";
  return Math.floor(s/86400) + "d ago";
}
let toastTimer = null;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

document.addEventListener("keydown", (e) => {
  if(document.getElementById("presentOverlay").style.display === "flex") return;
  if(!deck) return;
  const active = document.activeElement;
  if(active && (active.tagName === "INPUT" || active.isContentEditable)) return;
  if((e.key === "Delete" || e.key === "Backspace") && selectedElId){
    e.preventDefault();
    deleteSelectedElement();
  }
});

boot();
