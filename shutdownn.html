<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sink OS V2 Intro</title>
<style>
    body {
        margin: 0;
        background: black;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        color: white;
    }

    .text {
        position: absolute;
        font-size: 2.5rem;
        opacity: 0;
        text-align: center;
        animation-fill-mode: forwards;
    }

    /* UPDATED TIMED TEXT SEQUENCE */
    #t1 { animation: fade 10s 0s forwards; }     /* 00:00 - 00:10 */
    #t4 { animation: fade 2s 10s forwards; }     /* 00:10 - 00:12 */
    #t5 { animation: fade 3s 12s forwards; }     /* 00:12 - 00:15 */
    #t6 { animation: fade 1s 15s forwards; }     /* 00:15 - 00:16 */

    @keyframes fade {
        0% { opacity: 0; transform: translateY(20px); }
        20% { opacity: 1; transform: translateY(0); }
        80% { opacity: 1; }
        100% { opacity: 0; transform: translateY(-20px); }
    }

    /* --- CINEMATIC ENTRY ELEMENTS --- */

    #shockwave {
        position: absolute;
        width: 200vw;
        height: 200vh;
        background: radial-gradient(circle, white 0%, transparent 60%);
        opacity: 0;
        border-radius: 50%;
        animation: shockwave 1.2s 17s forwards;
        pointer-events: none;
    }

    @keyframes shockwave {
        0% { opacity: 0.9; transform: scale(0); }
        100% { opacity: 0; transform: scale(1); }
    }

    .ring {
        position: absolute;
        border: 4px solid rgba(0,150,255,0.4);
        border-radius: 50%;
        opacity: 0;
        animation-fill-mode: forwards;
    }

    #ring1 { width: 300px; height: 300px; animation: ringExpand 4s 17s forwards; }
    #ring2 { width: 450px; height: 450px; animation: ringExpand2 4s 17s forwards; }
    #ring3 { width: 600px; height: 600px; animation: ringExpand3 4s 17s forwards; }

    @keyframes ringExpand {
        0% { opacity: 0; transform: scale(0.2); }
        40% { opacity: 1; transform: scale(1.2); }
        100% { opacity: 0; transform: scale(1.6); }
    }

    @keyframes ringExpand2 {
        0% { opacity: 0; transform: scale(0.1); }
        40% { opacity: 1; transform: scale(1); }
        100% { opacity: 0; transform: scale(1.4); }
    }

    @keyframes ringExpand3 {
        0% { opacity: 0; transform: scale(0.05); }
        40% { opacity: 1; transform: scale(0.9); }
        100% { opacity: 0; transform: scale(1.2); }
    }

    #flare {
        position: absolute;
        width: 120vw;
        height: 4px;
        background: linear-gradient(90deg, transparent, white, transparent);
        opacity: 0;
        animation: flare 1.5s 17.3s forwards;
    }

    @keyframes flare {
        0% { opacity: 0; transform: translateX(-60vw); }
        40% { opacity: 1; }
        100% { opacity: 0; transform: translateX(60vw); }
    }

    #particles {
        position: absolute;
        width: 100%;
        height: 100%;
        pointer-events: none;
        opacity: 0;
        animation: particles 2s 17s forwards;
    }

    @keyframes particles {
        0% { opacity: 1; }
        100% { opacity: 0; }
    }

    #logo {
        width: 380px;
        opacity: 0;
        position: absolute;
        animation: logoSlam 4s 17s forwards;
    }

    @keyframes logoSlam {
        0% { opacity: 0; transform: scale(0.1) rotate(0deg); filter: blur(20px); }
        20% { opacity: 1; transform: scale(1.6); filter: blur(0); }
        40% { transform: scale(0.85); }
        60% { transform: scale(1.1); }
        80% { transform: scale(1); }
        100% { opacity: 1; transform: scale(1); }
    }

    @keyframes shake {
        0% { transform: translate(0,0); }
        20% { transform: translate(-8px, 5px); }
        40% { transform: translate(6px, -6px); }
        60% { transform: translate(-4px, 4px); }
        80% { transform: translate(4px, -3px); }
        100% { transform: translate(0,0); }
    }

    body.shake {
        animation: shake 0.4s ease 17.2s;
    }
</style>
</head>
<body>

<audio id="bgm" src="0520.MP3" preload="auto"></audio>

<!-- UPDATED TEXT -->
<div id="t1" class="text">Welcome</div>
<div id="t4" class="text">We engineered something new</div>
<div id="t5" class="text">This is the next evolution</div>
<div id="t6" class="text">Prepare yourself</div>

<!-- CINEMATIC ELEMENTS -->
<div id="shockwave"></div>
<div id="flare"></div>
<div id="particles"></div>

<div id="ring1" class="ring"></div>
<div id="ring2" class="ring"></div>
<div id="ring3" class="ring"></div>

<img id="logo" src="assets/a modern and minimal.png" alt="Sink OS Logo">

<script>
    const audio = document.getElementById("bgm");

    audio.play().catch(() => {
        document.body.addEventListener("click", () => audio.play(), { once: true });
    });

    setTimeout(() => {
        document.body.classList.add("shake");
    }, 17200);

    setTimeout(() => {
        window.location.href = "bootup.html";
    }, 21000);
</script>

</body>
</html>
