<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SinkOS V2 — Installing</title>
<style>
  html,body{
    height:100%;
    margin:0;
    background:#000;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:"Segoe UI","IBM Plex Sans",sans-serif;
  }

  .glow{
    position:absolute;
    width:420px;
    height:420px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(40,110,255,0.55) 0%, rgba(40,110,255,0.18) 45%, rgba(40,110,255,0) 70%);
    filter:blur(4px);
    animation:pulse 8s ease-in-out infinite;
  }

  @keyframes pulse{
    0%   { transform:scale(0.9);  opacity:0.6; }
    50%  { transform:scale(1.15); opacity:1;   }
    100% { transform:scale(0.9);  opacity:0.6; }
  }

  .textWrap{
    position:relative;
    z-index:2;
    text-align:center;
    color:#eaf1ff;
  }

  .title{
    font-size:26px;
    font-weight:500;
    letter-spacing:0.5px;
    margin-bottom:10px;
    opacity:0;
  }

  .subtitle{
    font-size:14px;
    color:#9fb3d9;
    letter-spacing:0.5px;
    opacity:0;
  }

  .fade-in{
    animation:fadeIn 1.4s ease forwards;
  }
  .fade-out{
    animation:fadeOut 1.4s ease forwards;
  }

  .bottomLog{
    position:absolute;
    bottom:36px;
    left:0;
    right:0;
    z-index:2;
    text-align:center;
    font-size:12px;
    color:#ffffff;
    letter-spacing:0.3px;
    opacity:0;
  }

  .log-fade-in{
    animation:logFadeIn 0.5s ease forwards;
  }
  .log-fade-out{
    animation:logFadeOut 0.5s ease forwards;
  }

  @keyframes logFadeIn{
    from{ opacity:0; }
    to{ opacity:1; }
  }
  @keyframes logFadeOut{
    from{ opacity:1; }
    to{ opacity:0; }
  }

  @keyframes fadeIn{
    from{ opacity:0; transform:translateY(6px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes fadeOut{
    from{ opacity:1; transform:translateY(0); }
    to{ opacity:0; transform:translateY(-6px); }
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="textWrap">
    <div class="title" id="title"></div>
    <div class="subtitle" id="subtitle"></div>
  </div>

  <div class="bottomLog" id="bottomLog"></div>

<script>
  const titleEl = document.getElementById('title');
  const subtitleEl = document.getElementById('subtitle');

  const phases = [
    { title: "Installing SinkOS V2", subtitle: "Do not close this window", log: "Rizzing up the opps" },
    { title: "Hang in there!",       subtitle: "Do not close this window", log: "Making our way to Mr Mejia's classroom" },
    { title: "Installing SinkOS V2", subtitle: "Do not close this window", log: "Calling Isaiah a dumpling" },
    { title: "Hang in there!",       subtitle: "Do not close this window", log: "Partying in CA4" },
    { title: "Installing SinkOS V2", subtitle: "Do not close this window", log: "Telling Nexus to quit bankrupting us" },
    { title: "Hang in there!",       subtitle: "Do not close this window", log: "Taking out the trash" },
    { title: "Installing SinkOS V2", subtitle: "Do not close this window", log: "Suggesting Isaac and Calep to quit wagging" },
    { title: "Hang in there!",       subtitle: "Do not close this window", log: "Praying to god Rav's N200 survives SinkOS V2" },
    { title: "Installing SinkOS V2", subtitle: "Do not close this window", log: "Questioning why the girls in our class are doing TikTok dances" },
    { title: "Hang in there!",       subtitle: "Do not close this window", log: "Questioning Tenielle's IQ count" },
    { title: "Installing SinkOS V2", subtitle: "Do not close this window", log: "Telling Joanne to get off her phone during class" }
  ];

  const phaseDuration = 30000 / phases.length;
  const fadeMs = 500;
  const holdMs = Math.max(phaseDuration - (fadeMs * 2), 300);

  const bottomLog = document.getElementById('bottomLog');

  function runPhase(i){
    if(i >= phases.length){
      window.location.href = "SinkOSAuth/login.html";
      return;
    }

    const phase = phases[i];
    titleEl.textContent = phase.title;
    subtitleEl.textContent = phase.subtitle;
    bottomLog.textContent = phase.log || "";

    titleEl.className = "title fade-in";
    subtitleEl.className = "subtitle fade-in";
    bottomLog.className = "bottomLog log-fade-in";

    setTimeout(() => {
      titleEl.className = "title fade-out";
      subtitleEl.className = "subtitle fade-out";
      bottomLog.className = "bottomLog log-fade-out";
      setTimeout(() => runPhase(i + 1), fadeMs);
    }, fadeMs + holdMs);
  }

  runPhase(0);
</script>
</body>
</html>
